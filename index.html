<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador Alfanumérico</title>


  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(1200px 600px at 80% 20%, #0b5cff22, transparent),
                  linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 36px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
      box-shadow: 0 40px 100px rgba(0,0,0,.65);
      animation: appear .7s ease;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 2.1rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      text-align: center;
      color: #94a3b8;
      font-size: .95rem;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      font-size: 1rem;
      outline: none;
      resize: vertical;
      transition: border .2s ease, box-shadow .2s ease;
    }

    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px #38bdf822;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }

    button:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }

    .primary {
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
      color: #020617;
    }

    .secondary {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1e293b;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 26px;
      display: grid;
      gap: 10px;
    }

    li {
      padding: 14px 18px;
      border-radius: 14px;
      background: #020617;
      border: 1px solid #1e293b;
      animation: slide .35s ease both;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      font-size: .75rem;
      color: #64748b;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes slide {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Organizador Alfanumérico</h1>
    <p>Ordena inteligentemente texto e números misturados (A–Z + 1–9).</p>

    <textarea id="input" placeholder="Exemplo:\nBanana\n10\n2\nAbacaxi\nCarro 12"></textarea>

    <div class="actions">
      <button class="primary" onclick="organizar()">Organizar tudo</button>
      <button class="secondary" onclick="limpar()">Limpar</button>
    </div>

    <ul id="resultado"></ul>

    <footer>Ordenação com locale pt-BR + animações suaves</footer>
  </main>

  <script>
    function organizar() {
      const raw = document.getElementById('input').value;
      const items = raw
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true, sensitivity: 'base' }));

      const ul = document.getElementById('resultado');
      ul.innerHTML = '';

      items.forEach((item, i) => {
        const li = document.createElement('li');
        li.style.animationDelay = `${i * 40}ms`;
        li.textContent = item;
        ul.appendChild(li);
      });
    }

    function limpar() {
      document.getElementById('input').value = '';
      document.getElementById('resultado').innerHTML = '';
    }
  </script>

</body>
</html>
