<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Organizador Alfanumérico Online</title>
<meta name="description" content="Organize texto e números automaticamente. Exporte em PDF ou Excel. Visual premium interativo." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #020617;
  --card: rgba(15, 23, 42, 0.85);
  --border: #1e293b;
  --primary: #38bdf8;
  --secondary: #6366f1;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: radial-gradient(circle at center, #020617 0%, #000 80%);
  overflow-y: auto; /* ✅ SCROLL CORRIGIDO */
}

/* Glow mouse */
.glow {
  position: fixed;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(56,189,248,.25), transparent 60%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 0;
}

/* App */
.app {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 6vh auto;
  padding: 36px;
  border-radius: 28px;
  background: var(--card);
  backdrop-filter: blur(22px);
  border: 1px solid var(--border);
  box-shadow: 0 50px 120px rgba(0,0,0,.65);
}

h1 { text-align: center; font-size: 2.4rem; }
p { text-align: center; color: var(--muted); margin-bottom: 24px; }

textarea {
  width: 100%;
  min-height: 160px;
  padding: 16px;
  border-radius: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
}

.controls, .actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 16px;
}

select, button, label {
  padding: 12px 18px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
}

button.primary {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #020617;
  border: none;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 24px;
}

li {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
}

/* ===== MODAL ERRO ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-card {
  max-width: 520px;
  padding: 28px;
  border-radius: 24px;
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  box-shadow: 0 40px 120px rgba(0,0,0,.6);
  animation: pop .45s cubic-bezier(.16,1,.3,1);
}

@keyframes pop {
  from { opacity: 0; transform: scale(.85); }
  to { opacity: 1; transform: scale(1); }
}

.modal-card h2 {
  margin-top: 0;
  text-align: center;
}

.modal-card p {
  text-align: center;
  line-height: 1.6;
}

.modal-card button {
  margin-top: 20px;
  width: 100%;
}
</style>
</head>

<body>

<div class="glow" id="glow"></div>

<!-- ⚠️ MODAL DE ERRO URGENTE -->
<div class="modal" id="errorModal">
  <div class="modal-card">
    <h2>⚠️ Instabilidade temporária</h2>
    <p>
      Identificamos um problema inesperado em uma das funcionalidades do app.<br><br>
      Já estamos trabalhando na correção.<br><br>
      Algumas ações podem não funcionar corretamente neste momento.<br><br>
      Agradecemos sua paciência.
    </p>
    <button class="primary" onclick="fecharErro()">Entendi</button>
  </div>
</div>

<main class="app">
  <h1>Organizador Alfanumérico</h1>
  <p>Versão 1.0 · Visual Premium</p>

  <textarea id="input"></textarea>

  <div class="controls">
    <select id="ordem">
      <option value="asc">A → Z</option>
      <option value="desc">Z → A</option>
    </select>
    <label><input type="checkbox" id="dedupe"> Remover duplicados</label>
  </div>

  <div class="actions">
    <button class="primary" onclick="organizar()">Organizar</button>
    <button onclick="copiar()">Copiar</button>
    <button onclick="baixarPDF()">PDF</button>
    <button onclick="baixarExcel()">Excel</button>
    <button onclick="limpar()">Limpar</button>
  </div>

  <ul id="resultado"></ul>
</main>

<script>
/* Glow */
document.addEventListener('mousemove', e => {
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

/* Modal erro */
function fecharErro() {
  document.getElementById('errorModal').style.display = 'none';
}

/* App */
let dados = [];

function organizar() {
  let items = input.value.split(/\n+/).map(v => v.trim()).filter(Boolean);
  if (dedupe.checked) items = [...new Set(items)];

  items.sort((a,b)=> ordem.value === 'asc'
    ? a.localeCompare(b,'pt-BR',{numeric:true,sensitivity:'base'})
    : b.localeCompare(a,'pt-BR',{numeric:true,sensitivity:'base'})
  );

  dados = items;
  resultado.innerHTML = '';
  items.forEach(i => resultado.innerHTML += `<li>${i}</li>`);
}

function copiar() {
  navigator.clipboard.writeText(dados.join('\n'));
}

function baixarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  dados.forEach((v,i)=>doc.text(v,10,10+i*8));
  doc.save('organizacao.pdf');
}

function baixarExcel() {
  const ws = XLSX.utils.aoa_to_sheet(dados.map(v=>[v]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Organizado');
  XLSX.writeFile(wb, 'organizacao.xlsx');
}

function limpar() {
  input.value=''; resultado.innerHTML=''; dados=[];
}
</script>

</body>
</html>
