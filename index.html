<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Organizador Alfanumérico — Em manutenção</title>
  <meta name="description" content="Nosso app está temporariamente em manutenção. Em breve voltaremos com melhorias." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(1000px 500px at 70% 20%, #2563eb33, transparent),
        linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
    }

    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px;
      border-radius: 28px;
      text-align: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(18px);
      box-shadow: 0 40px 100px rgba(0,0,0,.6);
      animation: appear .7s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      font-weight: 700;
    }

    p {
      margin: 0;
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: #020617;
      background: linear-gradient(135deg, #22d3ee, #3b82f6);
    }

    footer {
      margin-top: 28px;
      font-size: .75rem;
      color: #64748b;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="badge">EM MANUTENÇÃO</span>
    <h1>App temporariamente indisponível</h1>
    <p>
      Estamos realizando melhorias no <strong>Organizador Alfanumérico</strong>.<br>
      Aguarde alguns instantes — em breve voltaremos com novidades.
    </p>

    <footer>
      © 2026 — Organizador Alfanumérico
    </footer>
  </main>

</body>
</html>
